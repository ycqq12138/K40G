name: Build Kernel for K40G (ares)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Kernel Branch'
        required: true
        default: 'ares-r-oss'
      DEFCONFIG:
        description: 'Defconfig Name'
        required: true
        default: 'ares_user_defconfig'
      KERNELSU_VARIANT:
        description: 'KernelSU Variant (resukisu/sukisu/official)'
        required: true
        default: 'resukisu'
      ENABLE_SUSFS:
        description: 'Enable SUSFS'
        required: true
        default: 'true'
      ENABLE_KPM:
        description: 'Enable KPM Support'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential curl zip bc bison flex \
            libssl-dev device-tree-compiler python3 cpio kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi


      - name: Setup AOSP Clang
        run: |
          # AOSP Clang 12.0.5 (r416183b)，对 4.14 内核兼容性最好
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r416183b.tar.gz" -O clang.tar.gz
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV
          clang --version

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} kernel
          cd kernel
          echo "Kernel version: $(make kernelversion)"

      - name: Apply Device Patches
        run: |
          cd kernel
          if [ -d ../ares/patches ]; then
            for patch in ../ares/patches/*.patch; do
              [ -f "$patch" ] || continue
              echo "Applying: $(basename $patch)"
              git apply "$patch" || echo "WARNING: $patch failed"
            done
          fi

      - name: Add KernelSU
        run: |
          cd kernel
          echo "Adding ${{ github.event.inputs.KERNELSU_VARIANT }}..."
          
          case "${{ github.event.inputs.KERNELSU_VARIANT }}" in
            resukisu)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash
              ;;
            sukisu)
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-dev
              ;;
            official)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
              ;;
          esac
          
          echo "KernelSU added successfully"

      - name: Apply SUSFS Patches
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' && github.event.inputs.KERNELSU_VARIANT != 'sukisu' }}
        run: |
          cd kernel
          echo "Applying SUSFS patches..."
          if [ -d ../patches/susfs/4.14 ]; then
            for patch in ../patches/susfs/4.14/*.patch; do
              [ -f "$patch" ] || continue
              echo "Applying: $(basename $patch)"
              git apply "$patch" || echo "WARNING: $patch failed"
            done
          else
            echo "No SUSFS patches found"
          fi

      - name: Configure Kernel
        run: |
          cd kernel
          
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG }}"
          
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found: $DEFCONFIG_PATH"
            find arch/arm64/configs -name "*ares*" -o -name "*mt6893*" | head -20
            exit 1
          fi
          
          cat >> "$DEFCONFIG_PATH" << 'EOF'
          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_MTK_COMPAT=y
          
          # KPM Support
          CONFIG_KPM=y
          CONFIG_KSU_KPM=y
          CONFIG_KSU_KPM_PARAMS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KALLSYMS_BASE_RELATIVE=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SRCVERSION_ALL=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          
          # KPM Hook Infrastructure
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_FUNCTION_TRACER=y
          CONFIG_DYNAMIC_FTRACE=y
          CONFIG_DYNAMIC_FTRACE_WITH_REGS=y
          CONFIG_FTRACE_SYSCALLS=y
          CONFIG_FUNCTION_GRAPH_TRACER=y
          CONFIG_KPROBES_ON_FTRACE=y
          CONFIG_UPROBES=y
          EOF
          # CONFIG_CC_WERROR is not set
          echo "Defconfig updated"
      - name: Fix GPU Driver Warnings
        run: |
          cd kernel

          # 1. 从 GPU 驱动的 Makefile 中移除 -Werror
          for makefile in \
            drivers/gpu/drm/mediatek/Makefile \
            drivers/gpu/drm/panel/Makefile \
            drivers/gpu/drm/Makefile; do
            if [ -f "$makefile" ]; then
              sed -i 's/-Werror//g' "$makefile"
              echo "Removed -Werror from: $makefile"
            fi
          done

          # 2. 修复 mtk_disp_color.c 中的 format 类型不匹配
          # %x 期望 unsigned int，但实际传的是 unsigned long，改用 %lx
          if [ -f drivers/gpu/drm/mediatek/mtk_disp_color.c ]; then
            # 第 3127 行附近：pa:0x%x 改成 pa:0x%lx
            sed -i 's/dual pipe pa:0x%x(va:0x%lx)/dual pipe pa:0x%lx(va:0x%lx)/g' \
              drivers/gpu/drm/mediatek/mtk_disp_color.c
            # comp->reg_pa:(0x%x) 也需要修
            sed -i 's/comp->reg_pa:(0x%x)/comp->reg_pa:(0x%lx)/g' \
              drivers/gpu/drm/mediatek/mtk_disp_color.c
            # 中间的 0x%x 如果也是 long 也要改
            sed -i 's/= 0x%x (0x%x) comp/= 0x%x (0x%x) comp/g' \
              drivers/gpu/drm/mediatek/mtk_disp_color.c
            echo "Fixed format strings in mtk_disp_color.c"
          fi

          # 3. 修复 mtk_drm_drv.c
          if [ -f drivers/gpu/drm/mediatek/mtk_drm_drv.c ]; then
            sed -i 's/infra_regs:0x%p, infra_regs_pa:0x%lx/infra_regs:0x%p, infra_regs_pa:0x%lx/g' \
              drivers/gpu/drm/mediatek/mtk_drm_drv.c
            echo "Fixed format strings in mtk_drm_drv.c"
          fi

          echo "GPU driver fixes applied"
          
      - name: Create firmware placeholder
        run: |
          cd kernel
          mkdir -p include/firmware
          # 创建空的占位文件，让编译通过
          touch include/firmware/fw_sample.i
          echo "Created placeholder fw_sample.i"
          
      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          make O=out ${{ github.event.inputs.DEFCONFIG }}
          make O=out -j$(nproc) KCFLAGS=-w 2>&1 | tee build.log
          
          echo "Build output:"
          ls -la out/arch/arm64/boot/
          
          if [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Build SUCCESS"
          else
            echo "Build FAILED"
            tail -50 build.log
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          
          if [ -d kernel/out/arch/arm64/boot/dts/mediatek ]; then
            mkdir -p AnyKernel3/dtb
            cp kernel/out/arch/arm64/boot/dts/mediatek/*.dtb AnyKernel3/dtb/
          fi
          
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          
          sed -i 's/device.name1=.*/device.name1=ares/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=aresin/' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=Redmi K40 Gaming/' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          ZIP_NAME="K40G-${{ github.event.inputs.KERNELSU_VARIANT }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" * -x "*.git*" "README*"
          
          echo "Package: $ZIP_NAME"
          ls -la "../$ZIP_NAME"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: K40G-Kernel
          path: K40G-*.zip

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
        if: always()
